name: One-shot JCEC publication update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-jcec-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add JCEC paper at top of publications
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          doi = 'https://doi.org/10.1007/s10824-026-09607-y'
          if doi in s:
              raise SystemExit(0)

          heading = '<h3>Journal articles &amp; related media coverage</h3>'
          h = s.find(heading)
          if h < 0:
              raise SystemExit('Journal articles heading not found')
          ul = s.find('<ul class="publist">', h)
          if ul < 0:
              raise SystemExit('Journal articles list not found')
          pos = ul + len('<ul class="publist">')

          card = base64.b64decode('').decode('utf-8')
          s = s[:pos] + '\n\n' + card + s[pos:]
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add JCEC twelve notes paper"
          git push
