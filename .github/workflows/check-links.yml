name: Check links

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0" # weekly, Sunday 20:00 UTC

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check live website links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >
            --verbose
            --no-progress
            --method get
            --max-retries 3
            --max-concurrency 4
            --accept "100..=103,200..=299,403,405,429,999"
            --exclude "^https://www[.]sciencedirect[.]com/journal/international-journal-of-drug-policy/about/editorial-board/?$"
            "https://www.alexeev.pw/"
            "https://www.alexeev.pw/hope/"
            "https://www.alexeev.pw/family/"
            "https://www.alexeev.pw/revalue-au/"
            "https://www.alexeev.pw/mailbridge/privacy.html"
