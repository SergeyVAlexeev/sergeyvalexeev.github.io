name: One-shot Russia Talk link update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-russia-talk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Russia Talk podcast link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          anchor = '    · <a href="https://ridl.io/the-kremlin-s-veteran-hero-cult-stops-at-the-workplace-door/" target="_blank" rel="noopener">Riddle</a>\n'
          addition = '    · <a href="https://youtu.be/2bEqMO1bOpA" target="_blank" rel="noopener">Russia Talk</a>\n'

          if addition in s:
              raise SystemExit(0)
          if s.count(anchor) != 1:
              raise SystemExit(f'Expected one Riddle anchor, found {s.count(anchor)}')

          p.write_text(s.replace(anchor, anchor + addition, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Russia Talk podcast to veterans paper"
          git push
